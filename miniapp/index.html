<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Baraka Market</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 32 32" width="30" height="30" fill="none">
          <path d="M8 22c0-6 4-10 8-14 4 4 8 8 8 14a8 8 0 1 1-16 0Z" fill="#8dc63f"/>
          <path d="M16 10c-1.2 3.5-1.5 6.2-.8 9.2" stroke="#006837" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
      </span>
      <div class="brand-text">
        <p class="brand-eyebrow">Yetkazib berish</p>
        <h1 id="shopName">Baraka Market</h1>
        <p id="shopMeta" class="muted"></p>
      </div>
    </div>
  </header>

  <main>
    <section id="viewCatalog" class="view active">
      <div id="giftPromo" class="gift-promo" hidden>
        <img src="bonus-aksiya.jpg" alt="Super aksiya" width="640" height="360" />
        <p id="giftPromoText"></p>
      </div>
      <label class="search-wrap">
        <span class="search-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/>
            <path d="M20 20l-3.5-3.5"/>
          </svg>
        </span>
        <input
          id="productSearch"
          type="search"
          enterkeyhint="search"
          autocomplete="off"
          placeholder="Qidiruv: guruch, osh uchun, retsept…"
        />
        <button type="button" id="searchClear" class="search-clear" hidden aria-label="Tozalash">×</button>
      </label>
      <div
        id="categories"
        class="chips"
        role="tablist"
        aria-label="Toifalar"
      ></div>
      <div id="products" class="products"></div>
    </section>

    <section id="viewCart" class="view">
      <div id="giftProgress" class="gift-progress" hidden></div>
      <div id="cartList" class="cart-list"></div>
      <div class="cart-summary">
        <div class="row"><span>Mahsulotlar</span><strong id="subtotalLabel">0 so'm</strong></div>
        <div class="row"><span>Yetkazish</span><strong id="deliveryLabel">0 so'm</strong></div>
        <div class="row"><span>Chegirma</span><strong id="discountLabel">0 so'm</strong></div>
        <div class="row total"><span>Jami</span><strong id="totalLabel">0 so'm</strong></div>
        <p id="deliveryRates" class="delivery-rates"></p>
        <p id="minOrderHint" class="hint"></p>
        <p id="bonusHint" class="hint"></p>
      </div>

      <form id="checkoutForm" class="checkout">
        <label>
          Telefon
          <input id="phone" type="tel" inputmode="tel" placeholder="+998 90 123 45 67" required />
        </label>
        <label>
          Manzil
          <textarea id="address" rows="2" placeholder="Ko'cha, uy, mo'ljal" required></textarea>
        </label>
        <label>
          Yetkazish vaqti
          <select id="slot" required></select>
        </label>
        <label>
          Bonus (so'm)
          <input id="bonus" type="number" min="0" step="1" placeholder="0" />
        </label>
        <label>
          To'lov usuli
          <select id="paymentMethod">
            <option value="cash">Naqd</option>
            <option value="pending">Keyinroq tanlayman</option>
            <option value="card_waiting">Karta</option>
          </select>
        </label>
        <p class="pay-note">To‘lov faqat naqd. Qarzga berilmaydi — tushunganingiz uchun rahmat.</p>
        <label>
          Izoh (ixtiyoriy)
          <textarea id="note" rows="2" placeholder="Qo'ng'iroq qiling / eshik oldida qoldiring"></textarea>
        </label>
        <button type="submit" id="submitOrder" class="btn primary">Buyurtma berish</button>
        <p id="orderStatus" class="status" hidden></p>
      </form>
    </section>
  </main>

  <nav class="bottom-nav">
    <button type="button" class="nav-btn active" data-view="catalog">
      <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7" rx="1.5"/>
        <rect x="14" y="3" width="7" height="7" rx="1.5"/>
        <rect x="3" y="14" width="7" height="7" rx="1.5"/>
        <rect x="14" y="14" width="7" height="7" rx="1.5"/>
      </svg>
      <span>Katalog</span>
    </button>
    <button type="button" class="nav-btn" data-view="cart">
      <svg class="nav-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 6h15l-1.5 9h-12z"/>
        <circle cx="9" cy="20" r="1.25" fill="currentColor" stroke="none"/>
        <circle cx="17" cy="20" r="1.25" fill="currentColor" stroke="none"/>
        <path d="M6 6 5 3H2"/>
      </svg>
      <span>Savatcha</span>
      <span id="cartBadge" class="badge" hidden>0</span>
    </button>
  </nav>

  <dialog id="variantDialog">
    <form method="dialog" id="variantForm">
      <h3 id="variantTitle">Hajm tanlang</h3>
      <div id="variantOptions" class="variant-options"></div>
      <menu>
        <button value="cancel" class="btn ghost">Bekor</button>
      </menu>
    </form>
  </dialog>

  <script src="app.js?v=20"></script>
</body>
</html>

{% extends "base.html" %}
{% block title %}Kirish{% endblock %}
{% block content %}
<div class="login-box">
  <h1>{{ bot_name }}</h1>
  <p class="lead">Admin panelga kirish</p>
  {% if not password_configured %}
  <div class="flash error">
    <code>VOSITACHI_ADMIN_PASSWORD</code> o‘rnatilmagan. Env ga parol qo‘ying.
  </div>
  {% endif %}
  <form method="post" action="/login" class="form-grid">
    <div>
      <label for="password">Parol</label>
      <input id="password" type="password" name="password" required autocomplete="current-password" {% if not password_configured %}disabled{% endif %}>
    </div>
    <button type="submit" class="btn" {% if not password_configured %}disabled{% endif %}>Kirish</button>
  </form>
</div>
{% endblock %}

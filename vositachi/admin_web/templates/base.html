<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Admin{% endblock %} · {{ bot_name }}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="wrap">
    {% if request.url.path != '/login' %}
    <header class="topbar">
      <div class="brand">
        {{ bot_name }}
        <span>Admin panel · {{ area_label }}</span>
      </div>
      <nav class="nav">
        <a href="/" class="{% if request.url.path == '/' %}active{% endif %}">Bosh sahifa</a>
        <a href="/rides" class="{% if request.url.path.startswith('/rides') %}active{% endif %}">Safarlar</a>
        <a href="/drivers" class="{% if request.url.path.startswith('/drivers') %}active{% endif %}">Haydovchilar</a>
        <a href="/tariff" class="{% if request.url.path.startswith('/tariff') %}active{% endif %}">Tarif</a>
        <form method="post" action="/logout" style="display:inline;margin:0">
          <button type="submit" class="btn ghost small">Chiqish</button>
        </form>
      </nav>
    </header>
    {% endif %}

    {% if flash %}
    <div class="flash">{{ flash }}</div>
    {% endif %}
    {% if flash_error %}
    <div class="flash error">{{ flash_error }}</div>
    {% endif %}

    {% block content %}{% endblock %}
  </div>
</body>
</html>

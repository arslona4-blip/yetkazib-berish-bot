{% extends "base.html" %}
{% block title %}Tarif{% endblock %}
{% block content %}
<h1>Tarif sozlamalari</h1>
<p class="lead">Bot bilan bir xil DB sozlamalari (`settings` jadvali).</p>

<div class="panel">
  <form method="post" action="/tariff" class="form-grid">
    <div>
      <label for="base_fare">Baza narx (so‘m)</label>
      <input id="base_fare" type="text" name="base_fare" value="{{ tariff.base_fare|int }}" required>
    </div>
    <div>
      <label for="per_km">1 km narxi (so‘m)</label>
      <input id="per_km" type="text" name="per_km" value="{{ tariff.per_km|int }}" required>
    </div>
    <div>
      <label for="commission_pct">Komissiya (%)</label>
      <input id="commission_pct" type="text" name="commission_pct" value="{{ tariff.commission_pct }}" required>
    </div>
    <div>
      <label for="default_estimate_km">Taxminiy km (lokatsiyasiz)</label>
      <input id="default_estimate_km" type="text" name="default_estimate_km" value="{{ tariff.default_estimate_km }}" required>
    </div>
    <button type="submit" class="btn">Saqlash</button>
  </form>
</div>
{% endblock %}

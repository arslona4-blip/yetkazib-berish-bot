name: Ofis Nazorat Windows exe

on:
  workflow_dispatch:
  push:
    paths:
      - 'ofis-nazorat/**'
      - '.github/workflows/ofis-nazorat-windows.yml'
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: ofis-nazorat
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ofis-nazorat/package-lock.json
      - run: npm ci
      - run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: OfisNazorat-Windows
          path: ofis-nazorat/release/OfisNazorat*.exe
          if-no-files-found: error

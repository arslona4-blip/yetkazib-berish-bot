<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1e3a5f" />
  <title>Vositachi — shahar va mahalla</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="styles.css?v=1" />
</head>
<body>
  <header class="hero">
    <p class="eyebrow">Alohida xizmat</p>
    <h1>Vositachi</h1>
    <p class="lead">Mahalladan shaharga narsa kerak — taksi va mijoz o‘rtasida ulashamiz. Bu Baraka Market emas.</p>
  </header>

  <main>
    <form id="form" class="card">
      <label>
        Shahardan nima kerak?
        <textarea id="need" rows="3" required maxlength="400" placeholder="Masalan: dori, hujjat, ehtiyot qism…"></textarea>
      </label>
      <label>
        Qayerdan olinadi (shahar)
        <input id="fromPlace" type="text" maxlength="120" placeholder="Masalan: Namangan markaz, apteka" />
      </label>
      <label>
        Qayerga yetkazilsin (mahalla)
        <input id="toPlace" type="text" maxlength="120" required placeholder="Mahalla, ko‘cha, mo‘ljal" />
      </label>
      <label>
        Telefon
        <input id="phone" type="tel" inputmode="tel" required placeholder="+998 90 123 45 67" />
      </label>
      <label>
        Izoh (ixtiyoriy)
        <textarea id="note" rows="2" maxlength="240" placeholder="Vaqt, byudjet, qo‘ng‘iroq qiling…"></textarea>
      </label>
      <p class="hint">Narx haydovchi bilan kelishiladi. Biz faqat vositachimiz.</p>
      <button type="submit" id="submit" class="btn">So‘rov yuborish</button>
      <p id="status" class="status" hidden></p>
    </form>
  </main>
  <script src="app.js?v=1"></script>
</body>
</html>
